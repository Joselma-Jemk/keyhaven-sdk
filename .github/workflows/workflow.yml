name: Publish to PyPI

# Trusted publishing (OIDC) — no API token. Must be named `workflow.yml` to match
# the PyPI pending publisher configured for this repo. Fires on a GitHub Release.
on:
  release:
    types: [published]
  workflow_dispatch: {}

jobs:
  publish:
    name: Build & publish (PyPI trusted publisher)
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for OIDC trusted publishing
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: uv build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
