[project]
name = "keyhaven"
version = "0.1.0"
description = "Open-source Python SDK + CLI client for Keyhaven — OAuth and tool-calling for AI agents."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Joselma Jemk", email = "joselmakoutch@gmail.com" }]
keywords = ["ai", "agents", "oauth", "tool-calling", "mcp", "llm", "sdk"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

# Client-only deps — the SDK just speaks HTTP to a Keyhaven server.
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.optional-dependencies]
# LangChain / LangGraph tool adapter
langchain = ["langchain-core>=0.3"]

[project.urls]
Homepage = "https://github.com/Joselma-Jemk/keyhaven-sdk"
Repository = "https://github.com/Joselma-Jemk/keyhaven-sdk"
Issues = "https://github.com/Joselma-Jemk/keyhaven-sdk/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/keyhaven"]
license-files = ["LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "N", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
strict = true
